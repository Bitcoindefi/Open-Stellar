sonar.projectKey=Bitcoindefi_Open-Stellar
sonar.organization=bitcoindefi

sonar.sources=app,lib
sonar.tests=__tests__
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx

sonar.exclusions=**/node_modules/**,**/.next/**,**/coverage/**,**/dist/**,**/*.d.ts,**/scripts/templates/**
# React pages and browser-only modules (canvas renderer, Web Audio) run in the browser and are covered by
# Playwright e2e, not by the node-based vitest run that produces lcov.
sonar.coverage.exclusions=**/node_modules/**,**/*.test.ts,**/*.spec.ts,**/*.test.tsx,**/*.tsx,lib/renderer.ts,lib/audio/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

sonar.sourceEncoding=UTF-8